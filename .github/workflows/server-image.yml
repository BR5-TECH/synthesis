name: Server image

# The publishing workflow is kept apart from `CI` because the two have opposite
# postures. Verification runs on untrusted pull-request content with a read-only
# token and no secret. This runs only after a maintainer publishes a release, it
# holds the one write-scoped token in the repository, and it produces the only
# artifact either workflow produces.
#
# `release` with `types: [published]` and no other trigger: no pull request, no
# branch push, and no manual dispatch can publish an image. Because the trigger
# is the publication of a release rather than the creation of a tag, the
# workflow runs for a stable release and for a pre-release alike, and does not
# run for a draft. A draft that is published later fires the event at the moment
# it is published and is built then.
on:
  release:
    types: [published]

# Read-only at the workflow level. The one job below adds the single scope it
# needs, so nothing else in the run can write a package.
permissions:
  contents: read

jobs:
  # The only job. It reports no pull-request check and is named by no branch
  # protection rule, so a failed publication never blocks a merge and a merge
  # never waits on a publication.
  publish:
    runs-on: ubuntu-latest
    # Emulating the second architecture makes this the slowest job in the
    # repository, so the timeout is generous. It still terminates a hung step
    # rather than running to the platform default.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU compiles the architecture the runner is not. Which of emulation and
      # cross-compilation is used is the build's own choice and is not part of
      # the image contract.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The run's GITHUB_TOKEN and nothing else: no personal access token, no
      # registry password, and no other long-lived credential is stored in the
      # repository, read here, or written into the image.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry reference may not carry an upper-case character, so the
      # repository name is folded down. Both values reach the shell through the
      # environment rather than through inline interpolation, which is what
      # keeps a crafted repository or tag name out of the script itself.
      - name: Resolve the image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "reference=ghcr.io/${REPOSITORY,,}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      # One manifest list under one tag: the tag of the release that triggered
      # the run. No `latest`, no commit-hash tag, no branch tag.
      #
      # provenance and sbom are off so the manifest list holds the two platforms
      # and nothing else. Both would add an attestation entry that an
      # architecture check would have to look past.
      #
      # The release tag is passed into the build as the argument the crate's
      # build script reads, so the published image reports that tag from
      # GET /v1/health.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.reference }}
          build-args: |
            SYNTHESIS_BUILD_VERSION=${{ steps.image.outputs.tag }}
