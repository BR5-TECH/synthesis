body = "The graduation loop's own cycle has no test, because it cannot have one as written. driver.rs hardcodes AgentCliExecutor::default() (host Docker) at the execution turn and RigCompletion (a real provider) at the judgement, so nothing can drive drive()/judge() offline. Uncovered as a result: GRL-FR-09 (a `ready` verdict over a manifest the gate FAILED must be treated as `revise` — the last thing between a model's optimism and the repo), GRL-FR-14/ESU-FR-06 (an escalation ends the judgement, sibling tool calls go undispatched, a verdict beside it is not read), GRL-FR-12 (the iteration bound counts Continue and Request-changes turns and never resets), GRL-FR-11 (an agent `failure` envelope is material for the next turn, not an outcome), and the ProcessOutcome half of GRD-FR-18 (timeout / cancelled / non_zero_exit; the pre-launch half IS tested). The doubles already exist and are unused here: MockDockerRuntime with AgentCliExecutor::new(runtime), ScriptedCompletion (which agent_conversations drives its whole suite through), and infra/ACM-agentic-cli-mock.md specs an offline execution double for exactly this. GRL's own non-functional requirement says the loop is MEANT to be drivable under test with a scripted model and that double. Fix: thread an executor and a completion seam through drive() and judge(), defaulting to today's two."
