body = "AVI-FR-08 and AVI-TS-06 now describe behaviour the code no longer has, and need an analyst pass. The executor used to pin every image by digest and refuse an unpublished one before touching Docker; it now addresses a published image by digest as before and an UNPUBLISHED one by its image_ref tag, so an image built locally with docker build runs. The reason: a repository digest is issued by a registry, so a locally built image has none however correct it is, and addressing it by digest asked Docker to resolve something that cannot exist. The protection the digest buys is unchanged wherever a digest is recorded — putting one in the manifest restores the pin for that entry with no other change. Code: descriptor.rs::launch_reference (was pinned_reference), and the is_published() refusal removed from agent_exec.rs. Spec text still says \"the executor pins by the digest\" and \"a launch reports [an unpublished image] as an unavailable image\". AVI-FR-13 is untouched and still correct: verify is about published images and still fails on the sentinel by design."
