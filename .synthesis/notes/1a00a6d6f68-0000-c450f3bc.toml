body = "A graduation run that the application does not close down cleanly is never reconciled, and the queue it is at the head of stops for good. GRD-FR-31 moves the running run to `interrupted` when the project closes, the worktree changes, or the author quits from the menu — those are the only three callers of `interrupt_running`. A crash, a kill, a power loss, or a `pnpm tauri dev` restart reaches none of them, so the run stays persisted as `running`. On the next launch `maybe_start_head` starts only a run in `queued` or `requested_changes`; the stuck run is in neither, and because it is the head of its queue the function returns rather than looking further. No run in that project starts again, and the author is given no control that changes this: **Continue** is offered for `interrupted`, not for `running`. The container is orphaned at the same moment. It keeps working, keeps writing into the worktree, and holds a credential, but nothing can find it again: `--rm` removes it only when its own client sees it exit, the run record keeps no container name, and `unique_container_name` builds the name from the process id, the clock, and a counter, so it carries no run identifier. The output of that container is lost too — the stream reaches AGV only through the sink of the process that launched it. Two parts to resolve, and they are independent. First, reconcile on launch: a run persisted as `running` with no loop behind it is `interrupted` with a retryable failure, which puts **Continue** back in the author's hands and lets the queue move. Second, make the orphan findable: put the run identifier in the container name or in a Docker label, keep it in the run record, and sweep `synthesis-agent-*` at launch — then a container can be stopped, or possibly adopted, instead of being left to work for a run nobody watches."
