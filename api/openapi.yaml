openapi: 3.1.0
info:
  title: Synthesis server
  version: "1.0.0"
  summary: The application service and the relay boundary of the Synthesis server.
  description: |
    The REST surface of `specifications/server/SAS-server-application-service.md`,
    the relay introspection routes of
    `specifications/server/SRB-server-relay-boundary.md`, the project-discovery
    route of `specifications/server/RSN-remote-session.md`, and the three
    WebSocket upgrades of `specifications/server/WSK-websocket.md`.

    Every route and every WebSocket upgrade but `GET /v1/health` needs the header
    `Authorization: Bearer <token>`, carrying `SYNTHESIS_SERVER_TOKEN`. On the
    application routes the token authenticates the persisted administrator user
    (SAS-FR-LFCA, SAS-FR-XRPD), which bypasses every access-control check. On the
    relay it authenticates transport access alone (RSN-FR-TWQJ): the handle
    check, the worker-ownership check, and the end-to-end client authentication
    stand beside it.

    The permission each project-scoped operation needs is named in the
    description of that operation. The relay evaluates no permission.

    The frames the three WebSocket endpoints carry are not described here: a
    WebSocket protocol is outside what OpenAPI describes, and
    `specifications/server/WSK-websocket.md` holds the frame tables.
servers:
  - url: http://localhost:8080
    description: The service as it binds by default.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: The unauthenticated health route of BMS-FR-11.
  - name: Users
  - name: Teams
  - name: Organizations
  - name: Memberships
  - name: Invitations
  - name: Devices
  - name: Projects
  - name: Grants
    description: The project access-control grants of SAS-FR-CGTM.
  - name: Drafts
  - name: Conversations
  - name: Relay
    description: The read-only routing state of SRB-FR-SEKN.
paths:
  /v1/health:
    get:
      tags: [Health]
      summary: The build version the binary was compiled from, and the capabilities it serves.
      description: |
        The one route that needs no credential (BMS-FR-11). It reports the build
        version and the stable capability identifiers of BMS-FR-JQZW, and it
        reports no key, no QR content, no device registration, no application
        payload, no user, no project ownership, and no connection state.
      security: []
      responses:
        '200':
          description: The build version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

