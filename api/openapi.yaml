  /v1/relay/workers:
    get:
      tags: [Relay]
      summary: The active worker routes.
      description: The routing state is held in memory alone, and a restart drops every route.
      responses:
        '200':
          description: The active routes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerRoute'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/relay/workers/{instance_id}:
    parameters:
      - $ref: '#/components/parameters/InstanceId'
    get:
      tags: [Relay]
      summary: One worker route.
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRoute'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/relay/projects:
    get:
      tags: [Relay]
      summary: The projects one worker exposes to one registered client.
      description: |
        RSN-FR-MHDV. The request names a registered client with its opaque
        handle and the worker the handle is bound to. The answer holds the
        worker, its selected project, and its exposed projects, and holds no
        key, no handle, no application payload, no user, and no ownership data
        (RSN-FR-QLEC). It reports the announcement the worker route holds when
        the request is served; the relay caches nothing beyond it (RSN-FR-GXWB).
      parameters:
        - name: X-Synthesis-Client-Handle
          in: header
          required: true
          description: The opaque handle the relay assigned at registration.
          schema: { type: string }
        - name: X-Synthesis-Instance-Id
          in: header
          required: true
          description: The worker the handle is bound to.
          schema: { type: string }
      responses:
        '200':
          description: The exposed projects of that worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayProjects'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            The handle was revoked, expired, or reset (RSN-FR-TFJU). The error
            code is `handle_revoked`, `handle_expired`, or `handle_reset`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            No route holds the handle, the handle is bound to another worker, or
            the worker holds no active route (RSN-FR-TFJU, RSN-FR-ZDPA). The
            error code is `handle_not_found` or `worker_not_found`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/worker:
    get:
      tags: [Relay]
      summary: The worker WebSocket upgrade.
      description: |
        WSK-FR-KTRB. The IDE upgrades this route and speaks the worker protocol
        of `specifications/server/WSK-websocket.md`. The first frame is
        `worker_hello`. A request that is not an upgrade is answered
        `400 Bad Request` (WSK-FR-NAXC).
      responses:
        '101': { description: The connection speaks the worker protocol. }
        '400': { description: The request is not a WebSocket upgrade. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/client:
    get:
      tags: [Relay]
      summary: The client WebSocket upgrade.
      description: |
        WSK-FR-KTRB. The remote client upgrades this route and speaks the client
        protocol. The first frame is `client_attach`, carrying the opaque handle
        and the target worker.
      responses:
        '101': { description: The connection speaks the client protocol. }
        '400': { description: The request is not a WebSocket upgrade. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/registration:
    get:
      tags: [Relay]
      summary: The registration WebSocket upgrade.
      description: |
        WSK-FR-KTRB, WSK-FR-BJTN. The mobile client upgrades this route and
        speaks the registration protocol. The first frame is
        `registration_start`, and the relay answers `registration_bound` with a
        fresh opaque handle.
      responses:
        '101': { description: The connection speaks the registration protocol. }
        '400': { description: The request is not a WebSocket upgrade. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The static token of V1 (SAS-FR-LFCA), read from `SYNTHESIS_SERVER_TOKEN`.
        On the application routes it authenticates the persisted administrator
        user; on the relay routes and the WebSocket upgrades it authenticates
        transport access alone (SRB-FR-JEBM). The service compares it in constant
        time (SAS-FR-BZUK), and it reaches no answer, no log record, and no
        persisted record (SAS-FR-PMRB).
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: The page size. The default is 100 and the maximum is 500.
      schema: { type: integer, minimum: 1, maximum: 500 }
    Offset:
      name: offset
      in: query
      required: false
      description: How many records to pass over before the page starts.
      schema: { type: integer, minimum: 0 }
    MemberIdQuery:
      name: member_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    TargetTypeQuery:
      name: target_type
      in: query
      required: false
      schema: { type: string, enum: [user, team, organization] }
    TargetIdQuery:
      name: target_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    UserIdQuery:
      name: user_id
      in: query
      required: false
      description: The user whose permissions are read. It defaults to the caller.
      schema: { type: string, format: uuid }
    Cascade:
      name: cascade
      in: query
      required: false
      description: Deletes the drafts, the conversations, and the grants of the project with it.
      schema: { type: boolean, default: false }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamId:
      name: team_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftId:
      name: draft_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstanceId:
      name: instance_id
      in: path
      required: true
      description: The temporary identifier the IDE generated when it started.
      schema: { type: string }
  responses:
    BadRequest:
      description: |
        A field is absent, empty, or too long; an identifier is not a UUID; or a
        role or a permission is unknown. The codes are invalid_field,
        invalid_role, and invalid_permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: The request carries no accepted credential. The code is unauthenticated.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: The scheme the route accepts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The principal may read the record but holds no permission for the operation. The code is forbidden.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        No record holds the identifier, or the principal may not read the
        project, which is answered the same way so the existence of a project is
        not disclosed. The code is not_found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: |
        The write conflicts with the state the service holds. The codes are
        duplicate_id, duplicate_membership, duplicate_grant, owner_protected,
        referenced, stale_revision, conversation_locked, and
        invitation_not_pending.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [version, capabilities]
      additionalProperties: false
      properties:
        version: { type: string }
        capabilities:
          type: array
          description: |
            The capabilities this relay serves (BMS-FR-JQZW). V1 advertises
            exactly `remote_session` and `websocket`, each naming one
            specification. A client treats an identifier it does not know as
            unsupported.
          items: { type: string, enum: [remote_session, websocket] }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - forbidden
                - not_found
                - invalid_field
                - invalid_role
                - invalid_permission
                - duplicate_id
                - duplicate_membership
                - duplicate_grant
                - owner_protected
                - referenced
                - stale_revision
                - conversation_locked
                - invitation_not_pending
                - internal
            message: { type: string }
    Permission:
      type: string
      enum:
        - project.read
        - project.update
        - project.manage_acl
        - draft.read
        - draft.create
        - draft.update
        - draft.archive
        - draft.delete
        - draft.graduate
        - conversation.read
        - conversation.create
        - conversation.append
        - conversation.update
        - conversation.resolve
        - conversation.lock
    ProjectRole:
      type: string
      enum: [owner, administrator, contributor, viewer]
    MemberRole:
      type: string
      enum: [owner, administrator, member, viewer]
    TargetType:
      type: string
      enum: [user, team, organization]
    Status:
      type: string
      enum: [active, suspended]
    IdentityClaim:
      type: object
      required: [issuer, subject]
      properties:
        issuer: { type: string }
        subject: { type: string }
    User:
      type: object
      required: [id, display_name, role, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        identity:
          oneOf:
            - $ref: '#/components/schemas/IdentityClaim'
            - type: 'null'
        display_name: { type: string, maxLength: 200 }
        email: { type: [string, 'null'], maxLength: 320 }
        role: { type: string, enum: [administrator, member] }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUser:
      type: object
      required: [display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        role: { type: string, enum: [administrator, member] }
        issuer: { type: string }
        subject: { type: string }
    UpdateUser:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        role: { type: string, enum: [administrator, member] }
        status: { $ref: '#/components/schemas/Status' }
    Team:
      type: object
      required: [id, name, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateGroup:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid }
    UpdateGroup:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid }
    Membership:
      type: object
      required: [id, member_id, target_type, target_id, role, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        target_type: { type: string, enum: [team, organization] }
        target_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { $ref: '#/components/schemas/Status' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateMembership:
      type: object
      required: [member_id, target_type, target_id, role]
      properties:
        id: { type: string, format: uuid }
        member_id: { type: string, format: uuid }
        target_type: { type: string, enum: [team, organization] }
        target_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/MemberRole' }
    UpdateMembership:
      type: object
      properties:
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { $ref: '#/components/schemas/Status' }
    Invitation:
      type: object
      required: [id, target_type, target_id, inviter_id, role, expires_at, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [team, organization] }
        target_id: { type: string, format: uuid }
        inviter_id: { type: string, format: uuid }
        invitee_user_id: { type: [string, 'null'], format: uuid }
        invitee_email: { type: [string, 'null'], maxLength: 320 }
        role: { $ref: '#/components/schemas/MemberRole' }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, accepted, revoked] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateInvitation:
      type: object
      required: [target_type, target_id, role, expires_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [team, organization] }
        target_id: { type: string, format: uuid }
        invitee_user_id: { type: string, format: uuid }
        invitee_email: { type: string, maxLength: 320 }
        role: { $ref: '#/components/schemas/MemberRole' }
        expires_at: { type: string, format: date-time }
    AcceptInvitation:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The user the membership is written for. It defaults to the invitee.
    Device:
      type: object
      required: [id, owner_id, device_type, display_name, created_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        device_type: { type: string, enum: [ide, client] }
        display_name: { type: string, maxLength: 200 }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    CreateDevice:
      type: object
      required: [device_type, display_name]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        device_type: { type: string, enum: [ide, client] }
        display_name: { type: string, maxLength: 200 }
    UpdateDevice:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
        seen: { type: boolean, description: Moves the last-seen time to now. }
    Project:
      type: object
      required: [id, display_name, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name:
          type: string
          maxLength: 200
          description: Presentation only. The relay never routes by this value.
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProject:
      type: object
      required: [display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 200 }
        owner_id: { type: string, format: uuid }
    UpdateProject:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
    TransferOwnership:
      type: object
      required: [new_owner_id]
      properties:
        new_owner_id: { type: string, format: uuid }
    Grant:
      type: object
      required: [id, project_id, target_type, target_id, role, permissions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ProjectRole' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        revoked_by: { type: [string, 'null'], format: uuid }
    CreateGrant:
      type: object
      required: [target_type, target_id, role]
      properties:
        id: { type: string, format: uuid }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string, format: uuid }
        role:
          type: string
          enum: [administrator, contributor, viewer]
          description: The owner role is reached by a transfer of ownership alone.
    UpdateGrant:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [administrator, contributor, viewer]
    Draft:
      type: object
      required: [id, project_id, owner_id, title, content, state, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 1000000 }
        state: { type: string, enum: [active, archived, graduated] }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateDraft:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 1000000 }
        owner_id: { type: string, format: uuid }
    UpdateDraft:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 1000000 }
    Message:
      type: object
      required: [id, sequence, author_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        author_id: { type: string, format: uuid }
        body: { type: string, maxLength: 1000000 }
        created_at: { type: string, format: date-time }
    AppendMessage:
      type: object
      required: [body]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 1000000 }
    Conversation:
      type: object
      required: [id, project_id, owner_id, title, state, revision, messages, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        draft_id: { type: [string, 'null'], format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        state: { type: string, enum: [open, resolved, locked] }
        revision: { type: integer, minimum: 1 }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateConversation:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        draft_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
    UpdateConversation:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
    Roles:
      type: object
      required: [permissions, project_roles, team_roles, organization_roles]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        project_roles:
          type: array
          items:
            type: object
            required: [role, permissions]
            properties:
              role: { $ref: '#/components/schemas/ProjectRole' }
              permissions:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        team_roles:
          type: array
          items: { $ref: '#/components/schemas/MemberRole' }
        organization_roles:
          type: array
          items: { $ref: '#/components/schemas/MemberRole' }
    EffectivePermissions:
      type: object
      required: [user_id, permissions]
      properties:
        user_id: { type: string, format: uuid }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    ExposedProject:
      type: object
      required: [project_id, display_name]
      properties:
        project_id:
          type: string
          description: The opaque identifier the relay routes by.
        display_name:
          type: string
          description: Presentation only, and never a routing key.
    WorkerRoute:
      type: object
      required: [instance_id, connection_id, connected_at, projects, attached_clients]
      properties:
        instance_id: { type: string }
        connection_id: { type: string }
        connected_at: { type: string, format: date-time }
        projects:
          type: array
          items: { $ref: '#/components/schemas/ExposedProject' }
        selected_project_id: { type: [string, 'null'] }
        attached_clients: { type: integer, minimum: 0 }
    RelayProjects:
      type: object
      required: [instance_id, selected_project_id, projects]
      additionalProperties: false
      properties:
        instance_id: { type: string }
        selected_project_id: { type: [string, 'null'] }
        projects:
          type: array
          items: { $ref: '#/components/schemas/ExposedProject' }
